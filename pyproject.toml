[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-redteam"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2.0,<3", "pyarrow>=17,<22",
  "duckdb>=1.1,<2", "lightgbm>=4.5,<5", "scikit-learn>=1.5,<2",
  "networkx>=3.3,<4", "sentence-transformers>=3.1,<6", "torch>=2.4,<3",
  "streamlit>=1.38,<2", "plotly>=5.24,<7",
]

[tool.setuptools.packages.find]
include = ["core*", "attacks*", "redteam*", "models*", "eval*", "loop*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

